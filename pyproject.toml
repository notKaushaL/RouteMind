[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "routemind"
version = "0.1.0"
description = "AI-Powered Last-Mile Delivery Dispatch: Hybrid Neural-OR Optimization & Dynamic Fleet Simulation"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
# Phase 1 — Geospatial & Solver
phase1 = [
    "osmnx>=1.9",
    "networkx>=3.3",
    "h3>=3.7",
    "shapely>=2.0",
    "geopandas>=0.14",
    "ortools>=9.10",
    "pyvrp>=0.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "duckdb>=0.10",
]
# Phase 2 — CQR & MLOps
phase2 = [
    "lightgbm>=4.3",
    "catboost>=1.2",
    "mapie>=0.8",
    "shap>=0.45",
    "scikit-learn>=1.5",
    "mlflow>=2.13",
    "dvc>=3.51",
    "evidently>=0.4",
    "redis>=5.0",
    "pyarrow>=16",
    "fastparquet>=2024",
]
# Phase 3 — GNN
phase3 = [
    "torch>=2.3",
    "torch-geometric>=2.5",
]
# Phase 4 — RL
phase4 = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
]
# Backend
backend = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "celery>=5.4",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "geoalchemy2>=0.15",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
